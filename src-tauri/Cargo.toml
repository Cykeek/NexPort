[package]
name = "nexport"
version = "0.1.0-alpha"
description = "A Tauri SSH Client"
authors = ["you"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.85.0"

[lib]
name = "ssh_connect_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
russh = { version = "0.59", default-features = false, features = ["ring"] }
russh-sftp = "2.1"
russh-keys = "0.49"
tokio = { version = "1", features = ["full"] }
redb = "2.1"
aes-gcm = "0.10"
argon2 = "0.5"
thiserror = "2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "6"
zeroize = { version = "1", features = ["derive"] }
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "ecdsa", "rand_core", "std"] }
base64 = "0.22"
hostname = "0.4"
uuid = { version = "1", features = ["v4"] }
ed25519-dalek = "2"
log = "0.4"
dirs = "6"
