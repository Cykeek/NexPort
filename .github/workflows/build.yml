name: CI Build

on:
  push:
    branches: [main, dev, '**']
  pull_request:
    branches: ['**']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            artifact_name: 'macos'
          - platform: 'ubuntu-22.04'
            artifact_name: 'linux'
          - platform: 'windows-latest'
            artifact_name: 'windows'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt update
          sudo apt install -y build-essential libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev pkg-config libglib2.0-dev libayatana-appindicator3-dev

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign macOS app (ad-hoc)
        if: matrix.platform == 'macos-latest'
        run: |
          find src-tauri/target/release/bundle/macos -name "*.app" -exec codesign --force --deep --sign - {} \;

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexport-${{ matrix.artifact_name }}
          path: |
            src-tauri/target/release/bundle/**/*
            !src-tauri/target/release/bundle/**/*.sha256