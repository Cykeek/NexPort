name: CI Build

on:
  push:
    branches: [dev]
  pull_request:
    branches: ['**']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            artifact_name: 'macos'
          - platform: 'ubuntu-22.04'
            artifact_name: 'linux'
          - platform: 'windows-latest'
            artifact_name: 'windows'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt update
          sudo apt install -y build-essential libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev pkg-config libglib2.0-dev libayatana-appindicator3-dev

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Sign macOS app
        if: matrix.platform == 'macos-latest'
        run: |
          find src-tauri/target/release/bundle/macos -name "*.app" -exec codesign --force --deep --sign - {} \;

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexport-${{ matrix.artifact_name }}
          path: src-tauri/target/release/bundle/**/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-files

          # Copy installers only
          cp artifacts/nexport-windows/*.{exe,msi,sig} release-files/ 2>/dev/null || true
          cp artifacts/nexport-linux/*.{deb,AppImage,rpm,sig} release-files/ 2>/dev/null || true
          cp artifacts/nexport-macos/*.{dmg,tar.gz,sig} release-files/ 2>/dev/null || true

          # Find and read signature file properly
          SIG_FILE=$(find release-files -name "*.sig" | head -1)
          if [ -n "$SIG_FILE" ] && [ -f "$SIG_FILE" ]; then
            SIG=$(cat "$SIG_FILE")
          else
            SIG=""
          fi
          
          EXE=$(find release-files -name "*.exe" | head -1 | xargs basename 2>/dev/null || echo "")

          cat > release-files/latest.json << EOF
          {
            "version": "${{ steps.version.outputs.VERSION }}",
            "notes": "Version ${{ steps.version.outputs.VERSION }}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "$SIG",
                "url": "https://github.com/Cykeek/NexPort/releases/download/dev-${{ github.sha }}/$EXE"
              }
            }
          }
          EOF

          echo "=== Release files ==="
          ls -la release-files/
          echo ""
          echo "=== Signature file: $SIG_FILE ==="
          echo "$SIG"
          echo ""
          echo "=== latest.json ==="
          cat release-files/latest.json

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ github.sha }}
          name: NexPort v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: true
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update latest tag
        run: |
          git fetch --tags
          git tag -d latest || true
          git push origin :refs/tags/latest || true
          git tag latest
          git push origin latest