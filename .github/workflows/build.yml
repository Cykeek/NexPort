name: CI Build

on:
  push:
    branches: [main, dev, '**']
  pull_request:
    branches: ['**']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            artifact_name: 'macos'
          - platform: 'ubuntu-22.04'
            artifact_name: 'linux'
          - platform: 'windows-latest'
            artifact_name: 'windows'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt update
          sudo apt install -y build-essential libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev pkg-config libglib2.0-dev libayatana-appindicator3-dev zip

      - name: Install dependencies
        run: npm ci

      - name: Get current version
        id: current_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Sign macOS app (ad-hoc)
        if: matrix.platform == 'macos-latest'
        run: |
          find src-tauri/target/release/bundle/macos -name "*.app" -exec codesign --force --deep --sign - {} \;

      - name: Create ZIP bundles for updater
        if: matrix.platform == 'windows-latest'
        run: |
          cd src-tauri/target/release/bundle
          for dir in */*/; do
            if [ -d "$dir" ] && [[ "$dir" == *"x64"* ]] && [[ "$dir" == *"nexport"* ]]; then
              name=$(echo "$dir" | tr '/' '-' | tr '\\' '-')
              zip -r "${name}.zip" "$dir"
            fi
          done
          ls -la
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexport-${{ matrix.artifact_name }}
          path: |
            src-tauri/target/release/bundle/**/*
            !src-tauri/target/release/bundle/**/*.sha256

  release:
    needs: build
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get current version
        id: current_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create latest.json for updater
        run: |
          VERSION=${{ steps.current_version.outputs.VERSION }}
          COMMIT_SHA=${{ github.sha }}
          
          # Find Windows installer and signature
          WIN_DIR=$(find artifacts -type d -name "windows*" | head -1)
          SIG_FILE=""
          ZIP_FILE=""
          
          if [ -d "$WIN_DIR" ]; then
            SIG_FILE=$(find "$WIN_DIR" -name "*.sig" | head -1)
            ZIP_FILE=$(find "$WIN_DIR" -name "*.zip" | head -1)
          fi
          
          SIGNATURE=""
          if [ -f "$SIG_FILE" ]; then
            SIGNATURE=$(cat "$SIG_FILE")
          fi
          
          FILENAME=""
          if [ -f "$ZIP_FILE" ]; then
            FILENAME=$(basename "$ZIP_FILE")
          fi
          
          cat > latest.json << EOF
          {
            "version": "$VERSION",
            "notes": "Version $VERSION - Auto-update from dev branch",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "$SIGNATURE",
                "url": "https://github.com/Cykeek/NexPort/releases/download/dev-$COMMIT_SHA/$FILENAME"
              }
            }
          }
          EOF
          cat latest.json
        shell: bash

      - name: Create Release with all assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ github.sha }}
          name: NexPort Dev Build v${{ steps.current_version.outputs.VERSION }}
          draft: false
          prerelease: true
          generate_release_notes: false
          files: |
            latest.json
            artifacts/nexport-windows/**/*
            artifacts/nexport-linux/**/*
            artifacts/nexport-macos/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit version bump
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add package.json src-tauri/tauri.conf.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: bump version to ${{ steps.current_version.outputs.VERSION }}"
          git push
